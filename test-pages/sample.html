<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seeded design drift (netOS rules)</title>
<style>
  body { margin: 0; padding: 24px; background: #ffffff; color: #0f172a; font: 14px Inter, -apple-system, sans-serif; }
  h1 { font: 600 24px Montserrat, sans-serif; margin: 0 0 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  button { font-family: inherit; border: 0; color: #fff; background: #006f63; white-space: nowrap; cursor: pointer; padding: 0 16px; }
  .ok { height: 38px; font-size: 13px; font-weight: 600; border-radius: 12px; }
  .card { border: 1px solid #e2e8f0; padding: 12px; width: 160px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  input { height: 36px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
  .hint { margin: 0; color: #94a3b8; }
  .spill { width: 100px; white-space: nowrap; border: 1px solid #e2e8f0; }
</style>
</head>
<body>
  <h1 id="title">Loan application</h1>

  <div class="row">
    <button id="btn-ok" class="ok">Continue</button>
    <!-- seeded: height off the scale -->
    <button id="btn-bad-height" style="height:34px;font-size:13px;border-radius:12px">Continue</button>
    <!-- seeded: 16px text in a 32px button -->
    <button id="btn-bad-font" style="height:32px;font-size:16px;border-radius:12px">Continue</button>
    <!-- seeded: raw hex in an inline style -->
    <button id="btn-raw-hex" class="ok" style="background:#0f766e">Continue</button>
    <!-- seeded: icon-only button without a name -->
    <button id="btn-icon-noname" class="ok" style="width:38px;padding:0"><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="#fff"/></svg></button>
    <!-- seeded: button text wraps to two lines (nowrap overridden) -->
    <button id="btn-wrap" class="ok" style="width:80px;height:38px;white-space:normal;line-height:14px;padding:0 8px">Save changes now</button>
  </div>

  <div class="row">
    <div id="card-ok" class="card" style="border-radius:12px">Correct 12px card</div>
    <!-- seeded: radius not on the scale -->
    <div id="card-bad-radius" class="card" style="border-radius:7px">7px card</div>
    <!-- seeded: font not in the design system -->
    <p id="txt-bad-font" style="font-family: Arial, sans-serif; margin:0">Arial paragraph</p>
  </div>

  <div class="row">
    <div class="field"><label for="f-ok">Full name</label><input id="f-ok" type="text"></div>
    <!-- seeded: input without a label -->
    <div class="field"><input id="f-no-label" type="text" placeholder="Phone"></div>
  </div>

  <div class="row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <!-- seeded: DS "subtle" grey used for readable text (fails AA on white) -->
    <p id="hint" class="hint">Forgot your password?</p>
    <!-- seeded: text spills out of its box -->
    <div id="spill" class="spill">This label is far too long for its box</div>
    <!-- seeded: truncated without a title -->
    <div id="trunc-no-title" style="width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">This label is far too long for its box</div>
    <!-- correct: truncated with a title -->
    <div id="trunc-ok" title="This label is far too long for its box" style="width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">This label is far too long for its box</div>
  </div>
</body>
</html>
